<title>꾸미 사진첩</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 배치: 휴대폰 한 손 기준. 위에는 제목 한 줄, 가운데 한 기둥에 큼직한 사진, 아래에는 엄지가 닿는 고정 단추 줄.
   꾸밈은 포근한 구름과 달 하나뿐. 글씨체와 글씨 크기는 보는 사람이 설정에서 고릅니다. */
:root {
  --bg: #F2F4FA;            /* 새벽 하늘빛이 도는 흰색 */
  --surface: #FFFFFF;
  --ink: #221A2D;
  --ink-soft: #564D63;
  --line: #D5D9E6;
  --accent: #B3245B;        /* 진분홍 */
  --accent-deep: #8C1A46;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE4EC;
  --cloud: #F6BFD0;         /* 분홍 구름 */
  --cloud-pale: #DDE4F6;    /* 옅은 하늘 구름 */
  --moon: #FFD978;          /* 달·별 */
  --gold: #8A5E00;
  --gold-soft: #FFF1CC;
  --ok: #1B6A43;
  --ok-soft: #DDF3E6;
  --warn: #A1330F;
  --warn-soft: #FDE8DF;
  --focus: #1D4ED8;
  --shade: #15101C;         /* 사진을 크게 볼 때의 어두운 바탕 */
  --on-shade: #FFFFFF;
  --on-shade-soft: #D8D2E0;
  --shade-line: #4A4257;
  --veil: rgba(21, 16, 28, .62);
  --veil-strong: rgba(21, 16, 28, .88);
  --shadow: rgba(34, 26, 45, .26);
  --font-title: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
  --dock: 64px;             /* 아래 고정 단추 줄 높이 */
}
html { font-size: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1.1667rem; line-height: 1.6;   /* 설정 14포인트일 때 정확히 14포인트 */
  word-break: keep-all; overflow-wrap: anywhere;
}
body.noscroll { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
h1, h2, h3, p, figure { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 70rem; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main.wrap { padding-bottom: calc(var(--dock) + 5.5rem + env(safe-area-inset-bottom, 0px)); }

/* 단추 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  min-height: 3.25rem; padding: .55rem 1.2rem; border-radius: .9rem;
  border: 2px solid var(--ink); background: var(--surface); color: var(--ink);
  font-weight: 700; line-height: 1.25; cursor: pointer; text-align: center; text-decoration: none;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { border-color: var(--line); color: var(--ink-soft); font-weight: 500; }
.btn.danger { border-color: var(--warn); color: var(--warn); }
.btn.small { min-height: 2.75rem; padding: .35rem .9rem; font-size: .95rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg { display: flex; flex-wrap: wrap; gap: .4rem; }
.seg .btn { flex: 1 1 7rem; }
.pill {
  min-height: 2.75rem; padding: .3rem 1rem; border-radius: 99px; border: 2px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 700; font-size: .95rem; line-height: 1.2; cursor: pointer;
}
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.linkbtn { border: 0; background: none; padding: .5rem 0; color: var(--accent-deep); font-weight: 700; font-size: .95rem; cursor: pointer; text-decoration: underline; text-underline-offset: .22em; }

/* 맨 위 제목 줄 */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .3rem .6rem; min-height: 3.4rem; padding-block: .3rem; }
.brand { display: flex; align-items: center; gap: .5rem; min-width: 0; flex: 1 1 auto; }
.brand svg { width: 2.3rem; height: 2.3rem; flex: none; }
.brand h1 { font-family: var(--font-title); font-weight: 700; font-size: 1.4rem; line-height: 1.3; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-tools { display: flex; align-items: center; gap: .4rem; flex: none; }
.ga { font-family: var(--font-title); font-weight: 700; font-size: 1.25em; line-height: 1; }
.chip { display: inline-block; border-radius: 99px; padding: .15rem .8rem; font-weight: 700; font-size: .92rem; line-height: 1.5; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.chip.new { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* 알림 띠 */
.notice { background: var(--gold-soft); color: var(--ink); border-bottom: 1px solid var(--line); }
.notice .wrap { padding-block: .7rem; display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; }
.notice p { flex: 1 1 16rem; min-width: 0; font-size: .95rem; line-height: 1.5; }

/* 첫 화면: 만나는 날까지 / 태어난 지 */
.hero { margin-top: .8rem; display: grid; gap: .55rem; }
.hero-card { background: var(--surface); border: 1px solid var(--line); border-radius: 1.2rem; padding: .7rem 1rem; display: flex; align-items: center; gap: .9rem; }

}

.viewer { position: fixed; inset: 0; z-index: 40; background: var(--shade); color: var(--on-shade); display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

.v-top, .v-info, .v-nav { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 액자처럼 틀어 두기 */
.frame { position: fixed; inset: 0; z-index: 45; background: var(--shade); color: var(--on-shade); }
.f-stage { position: absolute; inset: 0; cursor: pointer; }

.frame.fill .f-stage img { object-fit: cover; }

.f-info { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none; text-align: center; background: linear-gradient(transparent, var(--veil-strong)); padding: 4rem max(16px, env(safe-area-inset-right, 0px)) calc(1.2rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: var(--veil); display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); color: var(--ink); border-radius: 1.3rem; width: min(100%, 40rem); max-height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .8rem 1.1rem; border-bottom: 1px solid var(--line); }

@media (max-width: 34rem) {

.files { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
.files li { border: 1px solid var(--line); border-radius: .9rem; padding: .7rem .8rem; display: grid; gap: .4rem; }

/* 설정: 글씨 크기 · 글씨체 */
.pref { display: grid; gap: .7rem; }

<main class="wrap">
  <section class="welcome" id="welcome" hidden>

    <p id="w-lead">이 사진첩은 가족 링크로만 열립니다. 링크를 눌렀는데도 이 화면이 보이면, 엄마·아빠에게 링크를 다시 보내 달라고 해 주세요.</p>

<script>
(() => {
'use strict';

/* 더 안전하게 쓰려면: 아래 따옴표 사이에 저장 서버 주소(또는 배포 번호)를 적어 두세요.
   그러면 가족 링크에 든 서버 주소는 무시하고 항상 이 서버만 씁니다. 비워 두어도 됩니다. */
const FIXED_SERVER = '';

const FRAME_SECONDS = 8;
const DEFAULTS = { title: '꾸미 사진첩', name: '꾸미', due: '', born: '', hello: '', lastBackup: 0 };   // 예정일·생일은 서버에서만 받아 옵니다
const ART = '<svg viewBox="0 0 120 84" aria-hidden="true"><circle cx="86" cy="26" r="18" style="fill:var(--moon)"/><circle cx="94" cy="20" r="15" style="fill:var(--surface)"/><g style="fill:var(--cloud-pale)"><circle cx="34" cy="38" r="12"/><circle cx="50" cy="32" r="15"/><circle cx="66" cy="40" r="11"/><rect x="23" y="38" width="54" height="14" rx="7"/></g><g style="fill:var(--cloud)"><circle cx="58" cy="60" r="12"/><circle cx="74" cy="53" r="15"/><circle cx="92" cy="61" r="11"/><rect x="46" y="60" width="58" height="14" rx="7"/></g><g style="fill:var(--moon)"><path d="M22 13l1.6 3.8 3.8 1.6-3.8 1.6L22 23.8l-1.6-3.8-3.8-1.6 3.8-1.6z"/><path d="M110 42l1.1 2.6 2.6 1.1-2.6 1.1-1.1 2.6-1.1-2.6-2.6-1.1 2.6-1.1z"/><circle cx="12" cy="56" r="2"/></g></svg>';   // 포근한 구름과 달

/* ───────── 작은 도구들 ───────── */
const $ = (sel, root = document) => root.querySelector(sel);
const sleep = ms => new Promise(r => setTimeout(r, ms));

    else if (k === 'text') el.textContent = v;

}
const store = {

  set(k, v) { try { localStorage.setItem('kkumi.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('kkumi.' + k); } catch (e) {} try { sessionStorage.removeItem('kkumi.' + k); } catch (e) {} },
  sget(k) { try { const v = sessionStorage.getItem('kkumi.' + k); return v == null ? null : JSON.parse(v); } catch (e) { return null; } },

};
const pad = n => String(n).padStart(2, '0');
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const ymd = dt => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const hm = dt => `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
const today = () => ymd(new Date());
const dayDiff = (a, b) => Math.round((toDate(a) - toDate(b)) / DAY);       // a - b (일)
const addDays = (s, n) => { const d = toDate(s); d.setDate(d.getDate() + n); return ymd(d); };
const koDate = s => { const d = toDate(s); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEK[d.getDay()]}요일`; };
const koShort = s => { const d = toDate(s); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`; };
function sizeText(n) {
  if (n >= 1073741824) return (n / 1073741824).toFixed(1) + '기가';
  if (n >= 1048576) return (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + '메가';
  return Math.max(1, Math.round(n / 1024)) + '킬로';
}
const cleanName = s => (String(s || '').replace(/[\\\/:*?"<>|\u0000-\u001f]/g, '_').replace(/^\.+/, '').trim().slice(0, 120)) || '사진';
function blobToB64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).slice(String(r.result).indexOf(',') + 1));
    r.onerror = () => rej(r.error || new Error('파일을 읽지 못했습니다.'));

  const bin = atob(b64); const n = bin.length; const u = new Uint8Array(n);
  for (let i = 0; i < n; i++) u[i] = bin.charCodeAt(i);

}

    if (active >= n || !q.length) return;

    job.fn().then(job.res, job.rej).finally(() => { active--; next(); });
  };
  return fn => new Promise((res, rej) => { q.push({ fn, res, rej }); next(); });
}
let toastTimer = 0;
function toast(text) {
  const t = $('#toast'); t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}
function fail(code, message) { const e = new Error(message); e.code = code; return e; }

/* ───────── 상태 ───────── */
const S = {
  cfg: { s: '', api: '', key: '' }, token: '', master: false, demo: false, loaded: false,
  settings: { ...DEFAULTS }, items: [], packs: [],
  tab: 'all',                                   // 'all' 사진 · 'moments' 첫 순간
  f: { star: false, month: '', compact: !!store.get('compact', false), oldest: !!store.get('oldest', false) },
  list: [], shown: 0, seenBefore: store.get('seen', null)
};

/* ───────── 가족 링크(서버 주소 + 가족 열쇠) ───────── */
const apiFromS = s => /^https?:\/\//.test(s) ? s : 'https://script.google.com/macros/s/' + s + '/exec';
function sFromInput(text) {
  text = String(text || '').trim();
  const m = /\/s\/([\w-]{20,})\/(?:exec|dev)/.exec(text);
  if (m) return m[1];
  if (/^[\w-]{30,}$/.test(text)) return text;
  if (/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(text)) return text;       // 개발·시험용
  return '';
}
function readCfg() {
  let s = '', k = '';
  try { const p = new URLSearchParams(location.hash.replace(/^#/, '')); s = sFromInput(p.get('s') || ''); k = p.get('k') || ''; } catch (e) {}
  const saved = store.get('cfg', null);
  const fixed = sFromInput(FIXED_SERVER);
  S.other = null;
  if (fixed) s = fixed;
  if (s && saved && saved.s && saved.s !== s && !fixed) {
    // 평소 보던 사진첩과 다른 서버를 가리키는 링크: 바로 바꾸지 않고 먼저 물어봅니다.
    S.other = { s, key: k }; s = saved.s; k = saved.key;
  }
  if (s) S.cfg = { s, api: apiFromS(s), key: k || (saved && saved.s === s ? saved.key : '') || '' };
  else if (saved && saved.s) S.cfg = { s: saved.s, api: apiFromS(saved.s), key: saved.key || '' };
  if (S.cfg.s) store.set('cfg', { s: S.cfg.s, key: S.cfg.key });
  S.token = store.get('token', '') || store.sget('token') || '';
}
function familyLink() {
  const base = location.href.split('#')[0];
  const fixed = sFromInput(FIXED_SERVER);
  return base + '#' + (fixed ? '' : 's=' + encodeURIComponent(S.cfg.s) + '&') + 'k=' + encodeURIComponent(S.cfg.key);
}
function putHash() {
  if (S.demo || !S.cfg.s) return;
  store.set('cfg', { s: S.cfg.s, key: S.cfg.key });
  try { history.replaceState(history.state, '', familyLink()); } catch (e) {}
}
function setToken(token, keep) {
  S.token = token || '';
  store.del('token');
  if (token) { if (keep) store.set('token', token); else store.sset('token', token); }
}

/* ───────── 서버와 이야기하기 ───────── */
async function api(a, body = {}, tries = 1) {
  if (S.demo) return Demo.call(a, body);
  for (let i = 0; i < tries; i++) {
    try {
      const res = await fetch(S.cfg.api, { method: 'POST', body: JSON.stringify({ a, k: S.cfg.key, t: S.token, ...body }) });
      const j = await res.json();
      if (!j.ok) throw fail(j.code || 'error', j.error || '문제가 생겼습니다.');
      return j;
    } catch (e) {
      if (e.code) { if (e.code === 'no_master') dropMaster(true); throw e; }
      if (i < tries - 1) await sleep(900 * (i + 1));
    }
  }

}
function dropMaster(expired) {
  const was = S.master;
  S.master = false; setToken('');
  renderMaster();
  if (was && expired) toast('로그인이 풀렸어요. 다시 들어가 주세요.');
}

/* ───────── 기기 안 보관함(다시 볼 때 빨리 뜨도록) ───────── */
const DB = {
  db: null,
  open() {
    if (this.db !== null) return Promise.resolve(this.db);
    return new Promise(res => {
      const done = v => { this.db = v; res(v); };
      try {
        const name = 'kkumi-' + (S.demo ? 'demo' : S.cfg.s.replace(/[^\w]/g, '').slice(-12));
        const r = indexedDB.open(name, 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('img'); r.result.createObjectStore('kv'); };
        r.onsuccess = () => done(r.result);
        r.onerror = () => done(false); r.onblocked = () => done(false);
        setTimeout(() => { if (this.db === null) done(false); }, 4000);
      } catch (e) { done(false); }
    });
  },
  async tx(storeName, mode, fn) {
    const db = await this.open(); if (!db) return undefined;
    return new Promise(res => {
      try {
        const t = db.transaction(storeName, mode); const out = fn(t.objectStore(storeName));
        t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);

      } catch (e) { res(undefined); }

  set(storeName, key, val) { return this.tx(storeName, 'readwrite', st => { st.put(val, key); }); },
  setMany(storeName, entries) { return this.tx(storeName, 'readwrite', st => { for (const [k, v] of entries) st.put(v, k); }); },
  del(storeName, key) { return this.tx(storeName, 'readwrite', st => { st.delete(key); }); },
  async clearAll() { await this.tx('img', 'readwrite', st => { st.clear(); }); await this.tx('kv', 'readwrite', st => { st.clear(); }); }
};

/* ───────── 그림 불러오기: 작은 그림(묶음) · 보기용 큰 그림 ───────── */
const thumbURL = new Map(), packWait = new Map(), viewURL = new Map(), viewWait = new Map(), viewBusy = new Map();
const viewLimit = limiter(3);

async function getThumb(it) {

}
function getView(it) {
  if (viewURL.has(it.id)) { const u = viewURL.get(it.id); viewURL.delete(it.id); viewURL.set(it.id, u); return Promise.resolve(u); }
  if (!it.v) return Promise.resolve(null);
  if (!viewWait.has(it.id)) {
    viewWait.set(it.id, (async () => {
      let blob = await DB.get('img', 'v:' + it.id);
      if (!blob) {
        const r = await viewLimit(() => api('view', { id: it.v }, 2));
        blob = b64ToBlob(r.data, r.mime);
        DB.set('img', 'v:' + it.id, blob);
      }

      viewURL.set(it.id, url); trimViews();
      return url;
    })().finally(() => viewWait.delete(it.id)));
  }
  return viewWait.get(it.id);
}
function trimViews() {
  if (S.demo || viewURL.size <= 60) return;
  const showing = F.open ? F.showing : V.open && V.list[V.i] ? V.list[V.i].id : '';
  for (const [id, url] of viewURL) {
    if (viewURL.size <= 60) break;
    if (id === showing || viewBusy.get(id)) continue;
    URL.revokeObjectURL(url); viewURL.delete(id);

/* ───────── 날짜 계산: 임신 주수 · 태어난 지 며칠 ───────── */
function monthsBetween(from, to) {
  const a = toDate(from), b = toDate(to);
  let m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  if (b.getDate() < a.getDate()) m--;
  return Math.max(0, m);
}
function pregText(date) {
  // 출산 예정일은 임신 40주 0일(280일째)로 셉니다.
  const st = S.settings; if (!st.due) return '';
  const g = 280 - dayDiff(st.due, date);
  if (g < 0 || g > 294) return '';
  return `임신 ${Math.floor(g / 7)}주 ${g % 7}일`;
}

  const st = S.settings;
  if (st.born) {
    const n = dayDiff(date, st.born);
    if (n === 0) return '태어난 날';
    if (n > 0) {
      const count = n + 1, months = monthsBetween(st.born, date);
      if (count === 100) return '백일';
      if (months >= 12 && months % 12 === 0 && toDate(date).getDate() === toDate(st.born).getDate()) return months === 12 ? '첫돌' : `${months / 12}번째 생일`;
      return `태어난 지 ${count}일째` + (months >= 1 ? ` · 생후 ${months}개월` : '');
    }

  }
  return pregText(date);
}

/* ───────── 화면 그리기 ───────── */
function applyIndex(idx) {

  S.packs = (idx && idx.packs) || [];

}
function renderAll(keep) {
  document.title = S.settings.title;

  // 최근 일주일 안에 올라온 사진을 먼저(새것부터), 나머지는 섞어서

function exifDate(buf) {
  // 사진 파일 안에 적힌 '찍은 날짜'를 읽습니다(없으면 null).
  try {
    const v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return null;
    let off = 2;
    while (off + 4 < v.byteLength) {
      const marker = v.getUint16(off), size = v.getUint16(off + 2);
      if ((marker & 0xFF00) !== 0xFF00) return null;
      if (marker === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) {
        const tiff = off + 10, le = v.getUint16(tiff) === 0x4949;
        const u16 = o => v.getUint16(o, le), u32 = o => v.getUint32(o, le);
        const find = (ifd, tag) => { const n = u16(ifd); for (let i = 0; i < n; i++) { const e = ifd + 2 + i * 12; if (u16(e) === tag) return e; } return 0; };
        const text = e => { let s = ''; const p = tiff + u32(e + 8); for (let i = 0; i < 19; i++) s += String.fromCharCode(v.getUint8(p + i)); return s; };
        const ifd0 = tiff + u32(tiff + 4);
        let str = '';
        const sub = find(ifd0, 0x8769);
        if (sub) { const exif = tiff + u32(sub + 8); const e = find(exif, 0x9003) || find(exif, 0x9004); if (e) str = text(e); }
        if (!str) { const e = find(ifd0, 0x0132); if (e) str = text(e); }
        const m = /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/.exec(str);
        if (!m || +m[1] < 1990) return null;
        return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
      }
      off += 2 + size;
    }
  } catch (e) {}
  return null;
}
function canvasBlob(canvas, q) { return new Promise(res => canvas.toBlob(b => res(b), 'image/jpeg', q)); }
function drawFit(src, sw, sh, max) {
  const r = Math.min(1, max / Math.max(sw, sh));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(sw * r)); c.height = Math.max(1, Math.round(sh * r));

  g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(src, 0, 0, c.width, c.height);

}
/** 올리기 전에 기기에서 '보기용 그림'과 '작은 그림'을 만듭니다. 못 만들면 서버가 나중에 채웁니다. */
async function makeImages(file, kind) {
  const out = { w: 0, h: 0, thumb: null, view: null };
  const url = URL.createObjectURL(file);
  try {
    let src = null;
    if (kind === 'p') {
      const img = new Image(); img.src = url; await img.decode();
      src = img; out.w = img.naturalWidth; out.h = img.naturalHeight;
    } else {
      src = await new Promise(res => {
        const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto';
        const timer = setTimeout(() => res(null), 9000);
        v.onloadeddata = () => { try { v.currentTime = Math.min(1, (v.duration || 2) / 2); } catch (e) { clearTimeout(timer); res(null); } };
        v.onseeked = () => { clearTimeout(timer); res(v); };
        v.onerror = () => { clearTimeout(timer); res(null); };

      });

    }
    if (src && out.w && out.h) {

      if (kind === 'p') out.view = await canvasBlob(big, 0.86);
      out.thumb = await canvasBlob(drawFit(big, big.width, big.height, 480), 0.72);
    }
  } catch (e) { /* 이 기기에서 열 수 없는 형식(예: 일부 휴대전화 사진) */ }

async function uploadOne(en, onPart) {
  const file = en.file, im = await makeImages(file, en.kind);
  const base = {
    name: file.name, mime: file.type || 'application/octet-stream', date: en.date, time: en.time, kind: en.kind, caption: en.caption || '',
    w: im.w, h: im.h, thumb: im.thumb ? await blobToB64(im.thumb) : '', view: im.view ? await blobToB64(im.view) : ''
  };
  let r;
  if (S.demo) r = await api('upload', { ...base, file });
  else if (file.size <= SIMPLE_MAX) { onPart(0.3); r = await api('upload', { ...base, orig: await blobToB64(file) }, 1); }
  else {
    const start = await api('uploadStart', { name: file.name, mime: base.mime, size: file.size, date: en.date }, 2);
    if (start.chunk) CHUNK = start.chunk;
    for (let off = 0; off < file.size; off += CHUNK) {
      await api('uploadChunk', { uploadId: start.uploadId, offset: off, data: await blobToB64(file.slice(off, off + CHUNK)) }, 1);
      onPart(Math.min(0.95, (off + CHUNK) / file.size));

    r = await api('upload', { ...base, uploadId: start.uploadId }, 1);

  const it = r.item;

  if (im.view) { viewURL.set(it.id, URL.createObjectURL(im.view)); DB.set('img', 'v:' + it.id, im.view); }

function backupName(it, used) {
  let name = cleanName(it.n).replace(/[. ]+$/, '') || ('사진 ' + it.id);
  const key = it.d + '/' + name.toLowerCase();
  if (used.has(key)) { const dot = name.lastIndexOf('.'); name = dot > 0 ? `${name.slice(0, dot)} (${it.id})${name.slice(dot)}` : `${name} (${it.id})`; }
  used.add(it.d + '/' + name.toLowerCase());
  return name;
}
const csvCell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
async function runBackup(dir, ui) {
  const root = await dir.getDirectoryHandle(S.settings.title.replace(/[\\\/:*?"<>|]/g, ' ').trim() || '사진첩', { create: true });
  const items = S.items.slice().sort((x, y) => (x.d < y.d ? -1 : x.d > y.d ? 1 : Number(x.id) - Number(y.id)));
  const used = new Set(), res = { saved: 0, had: 0, failed: [], stopped: false, bytes: 0, folder: root.name };
  const rows = [['찍은 날', '시각', '폴더', '파일 이름', '종류', '설명', '대표 사진', '첫 순간'].map(csvCell).join(',')];
  for (let i = 0; i < items.length; i++) {
    const it = items[i], name = backupName(it, used);
    rows.push([it.d, it.t || '', it.d, name, it.k === 'v' ? '영상' : '사진', it.c || '', it.s ? '예' : '', it.m || ''].map(csvCell).join(','));
    if (ui.stop) { res.stopped = true; continue; }
    ui.step(i, items.length, `${it.d} · ${name}`);
    try {
      const day = await root.getDirectoryHandle(it.d, { create: true });
      let have = false;
      try { const f0 = await (await day.getFileHandle(name)).getFile(); have = f0.size === it.z; } catch (e) {}
      if (have) { res.had++; continue; }
      const w = await (await day.getFileHandle(name, { create: true })).createWritable();
      try {
        let off = 0, size = it.z || 1;
        while (off < size) {
          const r = await api('orig', { id: it.o, offset: off, length: CHUNK }, 3);
          const bytes = b64ToBytes(r.data); size = r.size;
          if (!bytes.length) break;
          await w.write(bytes); off += bytes.length; res.bytes += bytes.length;
          ui.step(i + Math.min(1, off / size), items.length, `${it.d} · ${name}`);
          if (ui.stop) throw fail('stop', '멈춤');
        }
        await w.close();
      } catch (e) { try { await w.abort(); } catch (e2) {} throw e; }
      res.saved++;
    } catch (e) {
      try { const day = await root.getDirectoryHandle(it.d); const f1 = await (await day.getFileHandle(name)).getFile(); if (f1.size !== it.z) await day.removeEntry(name); } catch (e3) {}
      if (e.code === 'stop') res.stopped = true;
      else { res.failed.push(name); if (e.code === 'no_master') { res.stopped = true; ui.stop = true; } }
    }
  }
  try {
    const w = await (await root.getFileHandle('사진 목록.csv', { create: true })).createWritable();
    await w.write('﻿' + rows.join('\r\n') + '\r\n'); await w.close();
  } catch (e) {}
  return res;
}

      g.fillStyle = color; dot(cx - 1.05 * s, cy + 0.1 * s, 0.7 * s); dot(cx - 0.15 * s, cy - 0.35 * s, s); dot(cx + 0.95 * s, cy + 0.05 * s, 0.76 * s);
      g.beginPath(); g.ellipse(cx, cy + 0.5 * s, 1.9 * s, 0.52 * s, 0, 0, Math.PI * 2); g.fill();
    };
    const tints = ['rgba(255, 255, 255, .92)', '#F6BFD0', '#DDE4F6', 'rgba(255, 255, 255, .8)'];
    for (let i = 0; i < 4; i++) cloud(w * (0.12 + rnd() * 0.76), h * (0.42 + i * 0.13 + rnd() * 0.05), u * (0.07 + rnd() * 0.06), tints[i]);
    g.fillStyle = 'rgba(34, 26, 45, .55)'; g.font = `700 ${Math.round(u * 0.05)}px "Noto Sans KR", sans-serif`; g.textAlign = 'right';
    g.fillText('예시 그림', w - u * 0.04, h - u * 0.045);
    return c;
  },
  async build() {
    const samples = [
      [-130, '10:20', '예시) 처음 만난 날, 초음파 사진', 0, 1280, 960, '첫 초음파'], [-88, '15:05', '예시) 심장 소리를 들은 날', 0, 960, 1280, '첫 심장 소리'],
      [-46, '11:40', '예시) 정밀 초음파 보는 날', 1, 1280, 960], [-46, '13:10', '예시) 병원 다녀오는 길', 0, 1280, 960],
      [-11, '16:30', '예시) 아기 옷 첫 장만', 0, 1280, 960, '첫 아기 옷'], [-11, '16:42', '예시) 배냇저고리', 0, 960, 1280],
      [-3, '09:15', '예시) 아기방 꾸미는 중', 0, 1280, 960], [-3, '09:50', '', 0, 1280, 960],
      [-3, '20:00', '예시) 할머니가 떠 주신 양말', 1, 1280, 960]
    ];
    const items = [], base = Date.now() - 9 * DAY;
    for (let i = 0; i < samples.length; i++) {
      const [ago, t, c, s, w, hh, m] = samples[i], id = String(i + 1), d = addDays(today(), ago);
      const big = this.picture(i, w, hh), view = await canvasBlob(big, 0.85), thumb = await canvasBlob(drawFit(big, w, hh, 480), 0.75);
      setThumb(id, thumb); viewURL.set(id, URL.createObjectURL(view)); this.orig.set(id, view);
      items.push({ id, d, t, k: 'p', n: `예시 그림 ${id}.jpg`, c, s, m: m || '', o: 'demo-' + id, v: 'demo', p: 0, th: 1, z: view.size, w, h: hh, u: base + i * DAY });
    }
    this.idx = { v: 1, seq: items.length, packs: [], items, settings: { ...DEFAULTS, due: addDays(today(), 90), hello: '할머니 할아버지, 꾸미 보러 오셨어요? (예시 인사말)' } };
    S.seenBefore = base + 6.5 * DAY;
  },
  async call(a, b) {
    await sleep(160);
    const idx = this.idx, find = id => { const it = idx.items.find(x => x.id === String(id)); if (!it) throw fail('not_found', '사진을 찾을 수 없습니다.'); return it; };
    switch (a) {
      case 'list': return { ok: true, master: S.master, index: { ...idx, items: idx.items.map(x => ({ ...x })), settings: { ...idx.settings } } };
      case 'login': return { ok: true, token: 'demo', key: '' };
      case 'upload': {
        const it = { id: String(++idx.seq), d: b.date, t: b.time || '', k: b.kind === 'v' ? 'v' : 'p', n: cleanName(b.name), c: b.caption || '', s: 0, o: 'demo-' + idx.seq, v: b.view ? 'demo' : '', p: 0, th: b.thumb ? 1 : 0, z: b.file.size, w: b.w, h: b.h, u: Date.now() };
        this.orig.set(it.id, b.file); idx.items.push(it); return { ok: true, item: { ...it } };
      }
      case 'edit': { const it = find(b.id); if (b.caption !== undefined) it.c = b.caption; if (b.star !== undefined) it.s = b.star ? 1 : 0; if (b.moment !== undefined) it.m = b.moment; if (b.date) it.d = b.date; return { ok: true, item: { ...it } }; }
      case 'delete': find(b.id); idx.items = idx.items.filter(x => x.id !== String(b.id)); return { ok: true };
      case 'settings': Object.assign(idx.settings, b.settings); return { ok: true, settings: { ...idx.settings } };
      case 'info': return { ok: true, used: 71168000000, limit: 214748364800, key: '', folderUrl: '' };
      case 'orig': { const it = idx.items.find(x => x.o === b.id); const blob = it && this.orig.get(it.id); if (!blob) throw fail('not_found', '파일을 찾을 수 없습니다.'); return { ok: true, size: blob.size, data: await blobToB64(blob.slice(b.offset, b.offset + b.length)) }; }
      case 'changePw': return { ok: true, token: 'demo' };
      default: return { ok: true, fixed: 0, left: 0, key: '' };
    }
  }
};
async function startDemo() {
  S.demo = true; S.master = false; S.loaded = true; DB.db = false;
  $('#welcome').hidden = true; $('#album').hidden = false; $('#dock').hidden = false;
  await Demo.build();
  applyIndex(Demo.idx);
  showNotice('지금 보시는 것은 예시 화면입니다. 그림과 글은 모두 지어낸 것이에요. 아래 "설정"의 "엄마·아빠 전용 들어가기"에 아무 암호나 넣으면 올리기·고치기 화면도 볼 수 있습니다.',
    PREVIEW ? '' : '예시 끝내기', () => location.reload());
  renderAll();
}
async function init() {
  bindStatic();
  if (PREVIEW) return startDemo();
  readCfg();
  if (!S.cfg.s) return showWelcome();
  await enterAlbum();
}
init();
})();
