<title>꾸미 사진첩</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 배치: 휴대폰 한 손 기준. 위에는 제목 한 줄, 가운데 한 기둥에 큼직한 사진, 아래에는 엄지가 닿는 고정 단추 줄.
   꾸밈은 구름 사이에 걸린 파스텔 무지개 하나뿐. 색은 옅게, 글씨는 진하게. 글씨체와 글씨 크기는 보는 사람이 설정에서 고릅니다. */
:root {
  --bg: #FFFBF4;            /* 크림빛 흰색 */
  --surface: #FFFFFF;
  --ink: #3F3340;
  --ink-soft: #6A5D6B;
  --line: #EFE6DA;
  --line-strong: #D9CCC0;
  --edge: #8E7F8A;          /* 단추·입력 칸 테두리 */
  --accent: #B8517A;        /* 장밋빛: 큰 숫자·강조 글씨 */
  --primary: #F9CADB;       /* 파스텔 분홍: 주요 단추 */
  --accent-deep: #9C3F66;
  --accent-ink: #FFFFFF;
  --accent-soft: #FDEEF3;
  --rb1: #F9CADB; --rb2: #FFD9C0; --rb3: #FFEDB0; --rb4: #CDEBDD;   /* 무지개: 분홍·살구·노랑·민트 */
  --puff: #F1E6D8;          /* 구름 그늘 */
  --star: #FFDF8A;          /* 별 */
  --gold: #8A5E00;
  --gold-soft: #FFF1CC;
  --ok: #1B6A43;
  --ok-soft: #DDF3E6;
  --warn: #A1330F;
  --warn-soft: #FDE8DF;
  --focus: #1D4ED8;
  --shade: #15101C;         /* 사진을 크게 볼 때의 어두운 바탕 */
  --on-shade: #FFFFFF;
  --on-shade-soft: #D8D2E0;
  --shade-line: #4A4257;
  --veil: rgba(21, 16, 28, .62);
  --veil-strong: rgba(21, 16, 28, .88);
  --shadow: rgba(34, 26, 45, .26);
  --font-title: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
  --dock: 64px;             /* 아래 고정 단추 줄 높이 */
}
html { font-size: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1.1667rem; line-height: 1.6;   /* 설정 14포인트일 때 정확히 14포인트 */
  word-break: keep-all; overflow-wrap: anywhere;
}
body.noscroll { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
h1, h2, h3, p, figure { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 70rem; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main.wrap { padding-bottom: calc(var(--dock) + 5.5rem + env(safe-area-inset-bottom, 0px)); }

/* 단추 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  min-height: 3.25rem; padding: .55rem 1.2rem; border-radius: .9rem;
  border: 2px solid var(--edge); background: var(--surface); color: var(--ink);
  font-weight: 700; line-height: 1.25; cursor: pointer; text-align: center; text-decoration: none;
}
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--ink); }
.btn.quiet { border-color: var(--line-strong); color: var(--ink-soft); font-weight: 500; }
.btn.danger { border-color: var(--warn); color: var(--warn); }
.btn.small { min-height: 2.75rem; padding: .35rem .9rem; font-size: .95rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--ink); }
.seg { display: flex; flex-wrap: wrap; gap: .4rem; }
.seg .btn { flex: 1 1 7rem; }
.pill {
  min-height: 2.75rem; padding: .3rem 1rem; border-radius: 99px; border: 2px solid var(--line-strong);
  background: var(--surface); color: var(--ink); font-weight: 700; font-size: .95rem; line-height: 1.2; cursor: pointer;
}
.pill[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--ink); }
.linkbtn { border: 0; background: none; padding: .5rem 0; color: var(--accent-deep); font-weight: 700; font-size: .95rem; cursor: pointer; text-decoration: underline; text-underline-offset: .22em; }

/* 맨 위 제목 줄 */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .3rem .6rem; min-height: 3.4rem; padding-block: .3rem; }
.brand { display: flex; align-items: center; gap: .5rem; min-width: 0; flex: 1 1 auto; }
.brand svg { width: 2.3rem; height: 2.3rem; flex: none; }
.brand h1 { font-family: var(--font-title); font-weight: 700; font-size: 1.4rem; line-height: 1.3; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-tools { display: flex; align-items: center; gap: .4rem; flex: none; }
.ga { font-family: var(--font-title); font-weight: 700; font-size: 1.25em; line-height: 1; }
.chip { display: inline-block; border-radius: 99px; padding: .15rem .8rem; font-weight: 700; font-size: .92rem; line-height: 1.5; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); }
.chip.new { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* 알림 띠 */
.notice { background: var(--gold-soft); color: var(--ink); border-bottom: 1px solid var(--line); }
.notice .wrap { padding-block: .7rem; display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; }
.notice p { flex: 1 1 16rem; min-width: 0; font-size: .95rem; line-height: 1.5; }

/* 첫 화면: 만나는 날까지 / 태어난 지 */
.hero { margin-top: .8rem; display: grid; gap: .55rem; }
.hero-card { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 1.2rem; padding: .7rem 1rem; display: flex; align-items: center; gap: .9rem; }
.hero-main { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; column-gap: .9rem; }
.hero-kicker { flex: 1 1 8.5rem; min-width: 0; font-weight: 700; font-size: 1.05rem; line-height: 1.4; }
.hero-num { flex: none; font-family: var(--font-title); font-weight: 700; font-size: 2.5rem; line-height: 1.15; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hero-sub { flex: 1 1 100%; min-width: 0; color: var(--ink-soft); font-size: .92rem; line-height: 1.45; }
.hero-art { flex: none; }
.hero-art svg { display: block; width: min(5.4rem, 92px); height: auto; }
.hero-hello { font-family: var(--font-title); font-size: 1.08rem; line-height: 1.45; padding-inline: .2rem; }
.hero-count { display: flex; flex-wrap: wrap; gap: .4rem; }
@media (max-width: 26rem) { .hero-art { display: none; } }

/* 첫 순간: 옆으로 넘겨 보는 한 줄 */
.moments { margin-top: 1rem; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
.sec-head h2, .tab-title { font-family: var(--font-title); font-weight: 700; font-size: 1.25rem; line-height: 1.3; }
.tab-title { margin-top: 1.1rem; font-size: 1.5rem; }
.m-row { display: flex; gap: .5rem; overflow-x: auto; margin-inline: -16px; padding: .35rem 16px .3rem; scroll-snap-type: x proximity; scrollbar-width: none; }
.m-row::-webkit-scrollbar { display: none; }
.m-card { flex: none; width: 5.3rem; display: flex; flex-direction: column; align-items: center; gap: .3rem; padding: 0; border: 0; background: none; cursor: pointer; text-align: center; scroll-snap-align: start; }
.m-card .pic { width: 4.5rem; height: 4.5rem; aspect-ratio: 1; border-radius: 1.5rem; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--rb1); margin: 4px 0 2px; }
.m-card strong { font-size: .9rem; line-height: 1.3; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* 골라 보기 */
.filters { margin-top: .9rem; display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; }

/* 날짜 묶음 */
.day { margin-top: 1.5rem; }
.day:first-child { margin-top: 1rem; }
.day-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .7rem; margin-bottom: .7rem; }
.day-head h2 { font-family: var(--font-title); font-weight: 700; font-size: 1.3rem; line-height: 1.3; text-wrap: balance; }
.age { border-radius: 99px; padding: .05rem .75rem; font-weight: 700; font-size: .92rem; line-height: 1.6; background: var(--accent-soft); color: var(--accent-deep); }
.grid { display: grid; gap: 1.2rem 1rem; align-items: start; grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); }
.compact .grid { gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(min(30%, 9.5rem), 1fr)); }
.tile { min-width: 0; display: flex; flex-direction: column; gap: .45rem; }
.pic {
  position: relative; display: block; width: 100%; padding: 0; border: 0; cursor: pointer; overflow: hidden;
  border-radius: 1rem; background: var(--line); aspect-ratio: var(--ar, 4 / 3); max-width: 100%;
}
.compact .pic { aspect-ratio: 1; border-radius: .6rem; }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.pic .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-soft); font-weight: 500; }
.badges { position: absolute; left: .5rem; top: .5rem; display: flex; flex-wrap: wrap; gap: .3rem; }
.badge { border-radius: .5rem; padding: .05rem .55rem; font-size: .88rem; font-weight: 700; line-height: 1.6; background: var(--surface); color: var(--ink); }
.badge.new { background: var(--accent); color: var(--accent-ink); }
.badge.star { background: var(--gold-soft); color: var(--gold); }
.badge.moment { background: var(--accent-soft); color: var(--accent-deep); }
.badge.video { background: var(--shade); color: var(--on-shade); }

/** 글 속의 예전 이름을 새 이름으로 바꿉니다. */

/* ───────── 상태 ───────── */

function exifDate(buf) {
  // 사진 파일 안에 적힌 '찍은 날짜'를 읽습니다(없으면 null).
  try {
    const v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return null;
    let off = 2;
    while (off + 4 < v.byteLength) {
      const marker = v.getUint16(off), size = v.getUint16(off + 2);
      if ((marker & 0xFF00) !== 0xFF00) return null;
      if (marker === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) {
        const tiff = off + 10, le = v.getUint16(tiff) === 0x4949;
        const u16 = o => v.getUint16(o, le), u32 = o => v.getUint32(o, le);
        const find = (ifd, tag) => { const n = u16(ifd); for (let i = 0; i < n; i++) { const e = ifd + 2 + i * 12; if (u16(e) === tag) return e; } return 0; };
        const text = e => { let s = ''; const p = tiff + u32(e + 8); for (let i = 0; i < 19; i++) s += String.fromCharCode(v.getUint8(p + i)); return s; };
        const ifd0 = tiff + u32(tiff + 4);

        if (sub) { const exif = tiff + u32(sub + 8); const e = find(exif, 0x9003) || find(exif, 0x9004); if (e) str = text(e); }
        if (!str) { const e = find(ifd0, 0x0132); if (e) str = text(e); }
        const m = /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/.exec(str);
        if (!m || +m[1] < 1990) return null;
        return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
      }
      off += 2 + size;
    }
  } catch (e) {}
  return null;
}

      src = img; out.w = img.naturalWidth; out.h = img.naturalHeight;
    } else {
      src = await new Promise(res => {

    }

      out.thumb = await canvasBlob(drawFit(big, big.width, big.height, 480), 0.72);

/* ───────── 외장하드에 보관(백업) ───────── */
function backupName(it, used) {
  let name = cleanName(it.n).replace(/[. ]+$/, '') || ('사진 ' + it.id);

const csvCell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';

  const want = folderName(S.settings.title);
  try { return { root: await dir.getDirectoryHandle(want), old: false }; } catch (e) {}
  let best = null, seen = 0;
  try {
    for await (const ent of dir.values()) {

      try { const f = await (await ent.getFileHandle('사진 목록.csv')).getFile(); if (!best || f.lastModified > best.at) best = { root: ent, at: f.lastModified }; } catch (e) {}
    }

}

  const used = new Set(), res = { saved: 0, had: 0, failed: [], stopped: false, bytes: 0, folder: root.name, old };
  const rows = [['찍은 날', '시각', '폴더', '파일 이름', '종류', '설명', '대표 사진', '첫 순간'].map(csvCell).join(',')];
  for (let i = 0; i < items.length; i++) {
    const it = items[i], name = backupName(it, used);
    rows.push([it.d, it.t || '', it.d, name, it.k === 'v' ? '영상' : '사진', it.c || '', it.s ? '예' : '', it.m || ''].map(csvCell).join(','));
    if (ui.stop) { res.stopped = true; continue; }
    ui.step(i, items.length, `${it.d} · ${name}`);
    try {
      const day = await root.getDirectoryHandle(it.d, { create: true });
      let have = false;
      try { const f0 = await (await day.getFileHandle(name)).getFile(); have = f0.size === it.z; } catch (e) {}
      if (have) { res.had++; continue; }
      const w = await (await day.getFileHandle(name, { create: true })).createWritable();
      try {
        let off = 0, size = it.z || 1;

          const r = await api('orig', { id: it.o, offset: off, length: CHUNK }, 3);
          const bytes = b64ToBytes(r.data); size = r.size;
          if (!bytes.length) break;
          await w.write(bytes); off += bytes.length; res.bytes += bytes.length;
          ui.step(i + Math.min(1, off / size), items.length, `${it.d} · ${name}`);
          if (ui.stop) throw fail('stop', '멈춤');
        }
        await w.close();
      } catch (e) { try { await w.abort(); } catch (e2) {} throw e; }
      res.saved++;
    } catch (e) {
      try { const day = await root.getDirectoryHandle(it.d); const f1 = await (await day.getFileHandle(name)).getFile(); if (f1.size !== it.z) await day.removeEntry(name); } catch (e3) {}

    if (g.records && g.records.length) {
      const lines = [['잰 날', '몸무게(킬로)', '키(센티)', '머리둘레(센티)', '메모'].map(csvCell).join(',')].concat(g.records.map(r => [r.d, r.w, r.h, r.c, r.n || ''].map(csvCell).join(',')));

    }
  } catch (e) {}

}

  if (scrollTick) return;
  scrollTick = requestAnimationFrame(() => {
    scrollTick = 0;
    const calm = !$('#album').hidden && !V.open && !F.open;
    let label = '';
    if (calm && S.tab === 'all' && window.scrollY > 320) {
      for (const sec of $('#days').children) {
        const r = sec.getBoundingClientRect();
        if (r.bottom > 72) { if (r.top < 64) label = monthName(sec.dataset.m); break; }
      }
    }
    $('#month-tag').hidden = !label;
    if (label) $('#month-tag').textContent = label + ' ▾';
    $('#to-top').hidden = !(calm && window.scrollY > 1500);
  });
}

  if (btnLabel) { b.textContent = btnLabel; b.onclick = onBtn; }
}

}
async function refresh(keep) {
  try {
    const r = await api('list', {}, 3);
    S.master = !!r.master;
    if (!S.master && S.token) setToken('');
    applyIndex(r.index);
    if (!S.loaded) {
      S.loaded = true;
      const newest = S.items.reduce((a, x) => Math.max(a, x.u || 0), 0);
      if (S.master) S.seenBefore = null;
      store.set('seen', Math.max(newest, S.seenBefore || 0));
    }
    DB.set('kv', 'index', r.index); packWait.clear();
    $('#notice').hidden = true;
    renderAll(keep);
    // 엄마·아빠가 들어와 있을 때, 미리 보기 그림이 아직 없는 사진이 있으면 다시 채워 봅니다.
    if (S.master && S.items.some(x => !x.th || (x.k === 'p' && !x.v))) fillMissing();
  } catch (e) {
    if (e.code === 'no_key') { await DB.clearAll(); store.del('cfg'); showWelcome('이 링크로는 사진첩이 열리지 않아요. 링크가 새로 바뀌었을 수 있으니, 엄마·아빠에게 새 링크를 보내 달라고 해 주세요.'); }
    else if (e.code === 'not_ready') showWelcome('아직 처음 설정이 끝나지 않은 사진첩이에요.');
    else showNotice(S.items.length ? '연결이 잘 안 돼서 지난번에 본 사진을 보여 드리고 있어요.' : '사진첩에 연결하지 못했어요. 인터넷을 확인한 뒤 다시 눌러 주세요.', '다시 불러오기', () => refresh(true));
  }
}
async function enterAlbum() {
  $('#welcome').hidden = true; $('#album').hidden = false; $('#dock').hidden = false;
  renderAll();
  const cached = await DB.get('kv', 'index');
  if (cached && !S.loaded) { applyIndex(cached); renderAll(); }
  await refresh();
  if (S.other) {
    showNotice('방금 누른 링크는 평소 보던 사진첩과 다른 곳을 가리킵니다. 모르는 사람이 보낸 링크라면 무시하세요.', '그 사진첩으로 바꾸기', async () => {
      if (!(await ask('사진첩 바꾸기', '이 기기에서 보는 사진첩을 방금 누른 링크의 사진첩으로 바꿀까요? 믿을 수 있는 가족이 보낸 링크일 때만 바꾸세요.', '바꾸기', true))) return;
      store.set('cfg', S.other); setToken('');
      try { history.replaceState(null, '', '#s=' + encodeURIComponent(S.other.s) + '&k=' + encodeURIComponent(S.other.key)); } catch (e) {}
      location.reload();
    });
  }
}
function bindWelcome() {
  const msg = $('#w-msg');

  $('#w-form').addEventListener('submit', async e => {
    e.preventDefault(); msg.textContent = '';

    if (!s) { msg.textContent = '주소가 올바르지 않아요. 구글 앱스 스크립트에서 복사한 "웹 앱 주소"를 그대로 붙여넣어 주세요.'; return; }
    S.cfg = { s, api: apiFromS(s), key: '' };

  $('#w-new').addEventListener('submit', async e => {
    e.preventDefault(); msg.textContent = '';

  // 사진을 한 번 누르면 단추와 글자를 숨기고 사진만, 다시 누르면 되돌립니다. 두 번 누르면 확대합니다.
  let tapAt = 0, tapTimer = 0, hinted = false;
  $('#v-stage').addEventListener('click', e => {
    if (!V.open || $('#viewer').classList.contains('is-video') || e.target.closest('button, a')) return;
    const now = Date.now(), stage = $('#v-stage');
    clearTimeout(tapTimer);
    if (now - tapAt < 320) { tapAt = 0; toggleZoom(e); return; }
    tapAt = now;
    tapTimer = setTimeout(() => {
      if (stage.classList.contains('zoom')) { toggleZoom(); return; }
      const bare = $('#viewer').classList.toggle('bare');
      if (bare && !hinted) { hinted = true; toast('사진을 한 번 더 누르면 단추가 다시 나와요.'); }
    }, 330);
  });
  const onLand = () => { if (V.open && !$('#viewer').classList.contains('is-video')) $('#viewer').classList.toggle('bare', LAND.matches); };
  if (LAND.addEventListener) LAND.addEventListener('change', onLand); else if (LAND.addListener) LAND.addListener(onLand);
  let sx = 0, sy = 0;
  $('#v-stage').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $('#v-stage').addEventListener('touchend', e => {
    if (e.touches.length || $('#v-stage').classList.contains('zoom') || (window.visualViewport && window.visualViewport.scale > 1.05)) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { stopShow(); step(dx < 0 ? 1 : -1); }
  }, { passive: true });
  bindWelcome();
}

/* ───────── 예시 화면(설치 전 구경용) ───────── */
const Demo = {
  idx: null, orig: new Map(),
  picture(n, w, h) {
    let seed = 97 + n * 7919; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
    const skies = [['#FFF6EC', '#FDEEF3'], ['#F2F7FF', '#FDEEF3'], ['#F1FAF4', '#FFF6E6'], ['#FBF3FF', '#FFF1E8'], ['#FFF4F4', '#EEF6FF']];
    const sky = skies[n % skies.length], grad = g.createLinearGradient(0, 0, 0, h), u = Math.min(w, h);
    grad.addColorStop(0, sky[0]); grad.addColorStop(1, sky[1]); g.fillStyle = grad; g.fillRect(0, 0, w, h);
    const dot = (x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); };
    const cloud = (cx, cy, s) => {
      for (const [dy, color] of [[0.16, '#F1E6D8'], [0, '#FFFFFF']]) {
        g.fillStyle = color; dot(cx - 1.05 * s, cy + (0.1 + dy) * s, 0.7 * s); dot(cx - 0.15 * s, cy + (dy - 0.35) * s, s); dot(cx + 0.95 * s, cy + (0.05 + dy) * s, 0.76 * s);
        g.beginPath(); g.ellipse(cx, cy + (0.5 + dy) * s, 1.9 * s, 0.52 * s, 0, 0, Math.PI * 2); g.fill();
      }
    };
    const cx = w * (0.4 + rnd() * 0.2), cy = h * (0.7 + rnd() * 0.06), R = u * (0.3 + rnd() * 0.07), band = R * 0.17;     // 무지개
    g.lineCap = 'round';
    ['#F9CADB', '#FFD9C0', '#FFEDB0', '#CDEBDD'].forEach((color, i) => { g.strokeStyle = color; g.lineWidth = band; g.beginPath(); g.arc(cx, cy, R - i * band * 1.02, Math.PI, Math.PI * 2); g.stroke(); });
    cloud(cx - R + band, cy, R * 0.2); cloud(cx + R - band, cy, R * 0.2);
    cloud(w * (0.12 + rnd() * 0.2), h * (0.2 + rnd() * 0.1), u * 0.05); cloud(w * (0.7 + rnd() * 0.2), h * (0.16 + rnd() * 0.12), u * 0.042);
    g.fillStyle = '#FFDF8A';
    for (let i = 0; i < 7; i++) dot(w * (0.06 + rnd() * 0.88), h * (0.06 + rnd() * 0.4), u * (0.005 + rnd() * 0.007));
    g.fillStyle = 'rgba(63, 51, 64, .5)'; g.font = `700 ${Math.round(u * 0.05)}px "Noto Sans KR", sans-serif`; g.textAlign = 'right';
    g.fillText('예시 그림', w - u * 0.04, h - u * 0.045);
    return c;
  },
  async build() {
    const samples = [
      [-130, '10:20', '예시) 처음 만난 날, 초음파 사진', 0, 1280, 960, '첫 초음파'], [-88, '15:05', '예시) 심장 소리를 들은 날', 0, 960, 1280, '첫 심장 소리'],
      ['m1', '11:40', '예시) 정밀 초음파 보는 날', 1, 1280, 960], ['m1', '13:10', '예시) 병원 다녀오는 길', 0, 1280, 960],
      [-11, '16:30', '예시) 아기 옷 첫 장만', 0, 1280, 960, '첫 아기 옷'], [-11, '16:42', '예시) 배냇저고리', 0, 960, 1280],
      [-3, '09:15', '예시) 아기방 꾸미는 중', 0, 1280, 960], [-3, '09:50', '', 0, 1280, 960],
      [-3, '20:00', '예시) 할머니가 떠 주신 양말', 1, 1280, 960]
    ];
    const now = toDate(today()), lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const monthAgo = ymd(new Date(lastMonth.getFullYear(), lastMonth.getMonth(), Math.min(now.getDate(), new Date(lastMonth.getFullYear(), lastMonth.getMonth() + 1, 0).getDate())));   // '한 달 전 오늘' 예시용
    const items = [], base = Date.now() - 9 * DAY;
    for (let i = 0; i < samples.length; i++) {
      const [ago, t, c, s, w, hh, m] = samples[i], id = String(i + 1), d = ago === 'm1' ? monthAgo : addDays(today(), ago);
      const big = this.picture(i, w, hh), view = await canvasBlob(big, 0.85), thumb = await canvasBlob(drawFit(big, w, hh, 480), 0.75);
      setThumb(id, thumb); viewURL.set(id, URL.createObjectURL(view)); this.orig.set(id, view);
      items.push({ id, d, t, k: 'p', n: `예시 그림 ${id}.jpg`, c, s, m: m || '', o: 'demo-' + id, v: 'demo', p: 0, th: 1, z: view.size, w, h: hh, u: base + i * DAY });
    }
    this.growth = { seq: 4, records: [[-84, 3.3, 50.2, 34.5, '예시) 태어난 날'], [-56, 4.4, 54, 36.8, '예시) 한 달 검진'], [-28, 5.6, 58.1, 38.6, ''], [0, 6.5, 61.3, 40.1, '예시) 오늘']].map(([ago, w, hh, c, n], i) => ({ id: String(i + 1), d: addDays(today(), ago), w, h: hh, c, n, u: 0 })) };
    this.idx = { v: 1, seq: items.length, packs: [], items, settings: { ...DEFAULTS, due: addDays(today(), 90), hello: '할머니 할아버지, 꾸미 보러 오셨어요? (예시 인사말)' } };
    S.seenBefore = base + 6.5 * DAY;
  },
  async call(a, b) {
    await sleep(160);
    const idx = this.idx, find = id => { const it = idx.items.find(x => x.id === String(id)); if (!it) throw fail('not_found', '사진을 찾을 수 없습니다.'); return it; };
    switch (a) {

      case 'login': return { ok: true, token: 'demo', key: '' };

      case 'delete': find(b.id); idx.items = idx.items.filter(x => x.id !== String(b.id)); return { ok: true };
      case 'settings': Object.assign(idx.settings, b.settings); return { ok: true, settings: { ...idx.settings } };
      case 'info': return { ok: true, used: 71168000000, limit: 214748364800, key: '', folderUrl: '' };
      case 'orig': { const it = idx.items.find(x => x.o === b.id); const blob = it && this.orig.get(it.id); if (!blob) throw fail('not_found', '파일을 찾을 수 없습니다.'); return { ok: true, size: blob.size, data: await blobToB64(blob.slice(b.offset, b.offset + b.length)) }; }
      case 'changePw': return { ok: true, token: 'demo' };
      case 'growth': {
        const g = this.growth, num = v => (v === '' || v == null ? '' : Math.round(Number(v) * 100) / 100);
        if (b.op === 'save') { const r = b.record, rec = { id: r.id || String(++g.seq), d: r.d, h: num(r.h), w: num(r.w), c: num(r.c), n: r.n || '', u: Date.now() }; g.records = g.records.filter(x => x.id !== rec.id).concat(rec); }
        else if (b.op === 'delete') g.records = g.records.filter(x => x.id !== String(b.id));
        g.records.sort((x, y) => (x.d < y.d ? -1 : x.d > y.d ? 1 : 0));
        return { ok: true, records: g.records.map(x => ({ ...x })) };
      }
      default: return { ok: true, fixed: 0, left: 0, key: '' };
    }
  }
};
async function startDemo() {
  S.demo = true; S.master = false; S.loaded = true; DB.db = false;
  $('#welcome').hidden = true; $('#album').hidden = false; $('#dock').hidden = false;
  await Demo.build();
  applyIndex(Demo.idx);
  showNotice('지금 보시는 것은 예시 화면입니다. 그림과 글은 모두 지어낸 것이에요. 아래 "설정"의 "엄마·아빠 전용 들어가기"에 아무 암호나 넣으면 올리기·고치기 화면도 볼 수 있습니다.',
    PREVIEW ? '' : '예시 끝내기', () => location.reload());
  renderAll();
}
async function init() {
  bindStatic();
  if (PREVIEW) return startDemo();

}
init();
